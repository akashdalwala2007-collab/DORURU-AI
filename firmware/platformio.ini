; ============================================================================
; DORURU-AI — PlatformIO Project Configuration
; Target: Seeed Studio XIAO ESP32-S3 Sense
; ============================================================================

[platformio]
default_envs = seeed_xiao_esp32s3
src_dir = src
include_dir = include

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Target CPU frequency
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; 8MB Octal PSRAM (OPI) configuration
board_build.arduino.memory_type = qio_opi

; Serial & Hardware flags:
; 1. ARDUINO_USB_CDC_ON_BOOT=1: Route Serial debug logs over native USB CDC.
;    This is MANDATORY because default UART0 TX/RX pins overlap D6 (GPIO43, MAX98357A LRC)
;    and D7 (GPIO44, ILI9341 D/C). Using hardware UART0 corrupts audio and display.
; 2. BOARD_HAS_PSRAM: Enable 8MB OPI PSRAM heap allocation.
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -I include

monitor_speed = 115200
upload_speed = 921600

