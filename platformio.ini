; DORURU-AI PlatformIO Project Configuration
; Target: Seeed Studio XIAO ESP32-S3 Sense

[platformio]
default_envs = seeed_xiao_esp32s3
src_dir = firmware/src
include_dir = firmware/include

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; 8MB Octal PSRAM (OPI) configuration
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    ; Enable Native USB CDC so Serial prints over USB without touching UART0 (GPIO43/GPIO44)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCAMERA_MODEL_XIAO_ESP32S3
    -Ifirmware/include
    -Ifirmware/src/camera
    -Ifirmware/src/transport
    -Ifirmware/src/display

lib_deps =
    esp32-camera

